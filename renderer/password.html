<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Authorize</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app auth-app">
      <div class="panel auth-panel">
        <span class="status-label">elevate</span>
        <span class="auth-title">VPN Manager needs root</span>
        <span class="auth-sub">one-time prompt to run openvpn &amp; ip6tables</span>
        <input id="pw" type="password" placeholder="sudo password" class="auth-input" />
        <div class="auth-row">
          <button id="ok" class="btn btn-primary auth-grow">authorize</button>
          <button id="cancel" class="btn auth-grow">cancel</button>
        </div>
      </div>
    </div>
    <script src="password.js"></script>
  </body>
</html>
